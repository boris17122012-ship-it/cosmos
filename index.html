<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC VAULT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@latest/dist/browser.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: rgba(20, 20, 20, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --muted: #888888;
            --accent: #ffffff;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* Звездный фон */
        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Прелоадер */
        #preloader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .orbit-loader { width: 80px; height: 80px; position: relative; margin-bottom: 30px; }
        .orbit-loader::before, .orbit-loader::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
        .orbit-loader::before { inset: 0; border-top-color: #fff; animation: spin 1.5s linear infinite; }
        .orbit-loader::after { inset: 15px; border-bottom-color: #fff; animation: spin 2s linear infinite reverse; }
        .load-text { font-size: 12px; letter-spacing: 3px; color: #666; text-transform: uppercase; margin-bottom: 10px; }
        .load-bar-container { width: 150px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .load-bar-fill { width: 0%; height: 100%; background: #fff; transition: width 0.3s; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Интерфейс */
        #app { opacity: 0; transition: opacity 0.5s ease; }
        .header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
        .balances { display: flex; gap: 10px; }
        .bal { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; background: var(--card); border: 1px solid var(--border); padding: 8px 16px; border-radius: 30px; backdrop-filter: blur(10px); }
        .bal svg { width: 14px; height: 14px; fill: #fff; }

        /* Кейсы */
        .content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .sec-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .grid { display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 20px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(20px); cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
        .card:active { transform: scale(0.98); }
        .card.premium { border-color: rgba(255,255,255,0.4); box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .c-info { display: flex; flex-direction: column; gap: 5px; }
        .c-name { font-size: 16px; font-weight: 700; }
        .c-desc { font-size: 12px; color: var(--muted); }
        .c-prices { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        .c-p-stars { font-size: 16px; font-weight: 700; }
        .c-p-ton { font-size: 12px; color: #0098EA; font-weight: 600; }

        /* Кнопка Навигации (Снизу) */
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 20px 25px; display: flex; gap: 10px; background: linear-gradient(to top, #000 60%, transparent); z-index: 50; }
        .nav-btn { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 15px; text-align: center; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; backdrop-filter: blur(10px); transition: 0.2s; }
        .nav-btn:active { background: rgba(255,255,255,0.1); }

        /* Модальное окно */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        
        .roulette-box { width: 100%; max-width: 600px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .r-track { width: 100%; height: 160px; background: rgba(20,20,20,0.8); border: 1px solid var(--border); border-radius: 30px; overflow: hidden; position: relative; display: flex; align-items: center; }
        .r-items { display: flex; gap: 10px; position: absolute; left: 0; padding: 0 20px; transition: transform 0.1s linear; }
        .r-item { width: 120px; height: 120px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
        .r-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .r-item span { font-size: 12px; font-weight: 600; }
        
        .r-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.5); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px #fff; }
        
        /* Оверлей оплаты */
        .pay-box { background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 30px 20px; width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(20px); }
        .pay-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .pay-options { display: flex; flex-direction: column; gap: 10px; }
        .pay-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 30px; padding: 18px; font-size: 16px; font-weight: 600; color: #fff; display: flex; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .pay-btn:active { background: rgba(255,255,255,0.1); }
        .pay-btn span:last-child { color: var(--muted); font-size: 14px; }

        /* Результат */
        .result-box { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .result-img { width: 150px; height: 150px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid #fff; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
        .result-name { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .result-btn { background: #fff; color: #000; border: none; border-radius: 30px; padding: 15px 40px; font-size: 16px; font-weight: 700; margin-top: 20px; cursor: pointer; }
        
        /* Коллекция */
        #invList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 80px; }
        .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .inv-card img { width: 60px; height: 60px; margin-bottom: 10px; }
        .inv-name { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
        .inv-price { font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>

    <!-- Прелоадер -->
    <div id="preloader">
        <div class="orbit-loader"></div>
        <div class="load-text" id="loadText">Инициализация...</div>
        <div class="load-bar-container"><div class="load-bar-fill" id="loadBar"></div></div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app">
        <canvas id="stars-canvas"></canvas>
        
        <div class="header">
            <div class="logo">COSMIC VAULT</div>
            <div class="balances">
                <div class="bal">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span id="balStars">0</span>
                </div>
            </div>
        </div>

        <div class="content" id="mainContent">
            <!-- Здесь будут кейсы -->
            <div class="sec-title">ВЫБЕРИТЕ КЕЙС</div>
            <div class="grid" id="casesGrid"></div>
        </div>

        <div class="content" id="invContent" style="display:none;">
            <div class="sec-title">ВАША КОЛЛЕКЦИЯ</div>
            <div id="invList"></div>
        </div>

        <div class="nav">
            <button class="nav-btn" onclick="switchTab('cases')">КЕЙСЫ</button>
            <button class="nav-btn" onclick="switchTab('inv')">КОЛЛЕКЦИЯ</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        
        <!-- Шаг 1: Оплата -->
        <div class="pay-box" id="payStep">
            <div class="pay-title" id="modalTitle">ОТКРЫТИЕ</div>
            <div class="pay-options" id="payOptions"></div>
            <button style="margin-top:20px; background:none; border:none; color:var(--muted); font-size:14px;" onclick="closeModal()">Отмена</button>
        </div>

        <!-- Шаг 2: Рулетка -->
        <div class="roulette-box" id="spinStep" style="display:none;">
            <div class="r-track">
                <div class="r-marker"></div>
                <div class="r-items" id="rItems"></div>
            </div>
        </div>

        <!-- Шаг 3: Результат -->
        <div class="result-box" id="resultStep" style="display:none;">
            <img src="" class="result-img" id="resImg">
            <div class="result-name" id="resName">Название</div>
            <div style="color:var(--muted); font-size:14px;" id="resPrice">0 ⭐</div>
            <button class="result-btn" onclick="closeModal()">ЗАБРАТЬ</button>
        </div>

    </div>

<script>
    // ============ НАСТРОЙКИ И ДАННЫЕ ============
    const RECEIVER = "UQBYFdivQebVdF1Q2moiL42d_zPtjXrMiuj9HmmzCPTuZy8m";
    const TON_RATE = 100; // 1 TON = 100 ⭐ (курс для расчета)
    
    // Используем открытые SVG иконки для стиля (без цветных эмодзи)
    const icons = {
        star: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>",
        moon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1.5'><path d='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z'/></svg>",
        gift: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1.5'><polyline points='20 12 20 22 4 22 4 12'/><rect x='2' y='7' width='20' height='5'/><line x1='12' y1='22' x2='12' y2='7'/><path d='M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z'/><path d='M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z'/></svg>",
        diamond: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1.5'><polygon points='12 2 22 8.5 12 22 2 8.5 12 2'/><line x1='2' y1='8.5' x2='22' y2='8.5'/><line x1='12' y1='22' x2='12' y2='8.5'/></svg>",
        planet: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1.5'><circle cx='12' cy='12' r='7'/><ellipse cx='12' cy='12' rx='11' ry='4' transform='rotate(-30 12 12)'/></svg>",
        blackhole: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1.5'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='3' fill='white'/></svg>"
    };

    // Реальные NFT Telegram Fragment (упрощенные названия)
    const nftPool = [
        { name: "Tiny Heart", val: 10, icon: icons.star },
        { name: "Space Bear", val: 15, icon: icons.moon },
        { name: "Cosmic Cake", val: 20, icon: icons.gift },
        { name: "Star Fragment", val: 25, icon: icons.star },
        { name: "Moon Stone", val: 30, icon: icons.moon },
        { name: "Gift Box", val: 40, icon: icons.gift },
        { name: "Diamond Ring", val: 60, icon: icons.diamond },
        { name: "Planet Core", val: 80, icon: icons.planet },
        { name: "Nebula Dust", val: 100, icon: icons.star },
        { name: "Event Horizon", val: 150, icon: icons.blackhole },
        { name: "Galaxy Pass", val: 250, icon: icons.planet },
        { name: "Supernova", val: 400, icon: icons.star }
    ];

    // Кейсы (цены 15 - 500)
    const cases = [
        { id: 1, name: "ЛУННАЯ ОРБИТА", desc: "Базовые артефакты", price: 15, premium: false, max: 25 },
        { id: 2, name: "ПОЯС АСТЕРОИДОВ", desc: "Редкие частицы", price: 50, premium: false, max: 80 },
        { id: 3, name: "ТУМАННОСТЬ АНДРОМЕДЫ", desc: "Древние реликвии", price: 150, premium: true, max: 250 },
        { id: 4, name: "МЛЕЧНЫЙ ПУТЬ", desc: "Эпические NFT", price: 300, premium: true, max: 400 },
        { id: 5, name: "ЧЕРНАЯ ДЫРА", desc: "Легендарный дроп", price: 500, premium: true, max: 1000 }
    ];

    let userStars = 1000; // Стартовый баланс для теста
    let inventory = JSON.parse(localStorage.getItem('cv_inv_v2')) || [];
    let currentCase = null;
    let isSpinning = false;
    let tonConnectUI = null;

    // ============ ИНИЦИАЛИЗАЦИЯ ============
    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }

    // Прелоадер (3 секунды)
    let loadP = 0;
    const loadInterval = setInterval(() => {
        loadP += Math.random() * 15;
        if(loadP > 100) loadP = 100;
        document.getElementById('loadBar').style.width = loadP + '%';
        
        if(loadP > 30) document.getElementById('loadText').textContent = "Синхронизация...";
        if(loadP > 70) document.getElementById('loadText').textContent = "Подключение...";
        
        if(loadP === 100) {
            clearInterval(loadInterval);
            setTimeout(() => {
                document.getElementById('preloader').style.opacity = '0';
                document.getElementById('app').style.opacity = '1';
                setTimeout(() => document.getElementById('preloader').style.display = 'none', 500);
            }, 400);
        }
    }, 200);

    function init() {
        updateUI();
        renderCases();
        renderInv();
        initTon();
        drawStars();
    }

    // ============ TON ============
    function initTon() {
        try {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: location.origin + '/tonconnect-manifest.json',
                uiPreferences: { theme: 'DARK' }
            });
        } catch(e) { console.warn(e); }
    }

    // ============ ОТРИСОВКА ============
    function renderCases() {
        const g = document.getElementById('casesGrid');
        g.innerHTML = '';
        cases.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card' + (c.premium ? ' premium' : '');
            div.onclick = () => openCase(c);
            div.innerHTML = `
                <div class="c-info">
                    <div class="c-name">${c.name}</div>
                    <div class="c-desc">${c.desc}</div>
                </div>
                <div class="c-prices">
                    <div class="c-p-stars">${c.price} ⭐</div>
                    <div class="c-p-ton">${(c.price / TON_RATE).toFixed(2)} TON</div>
                </div>
            `;
            g.appendChild(div);
        });
    }

    function updateUI() {
        document.getElementById('balStars').textContent = userStars;
    }

    function switchTab(tab) {
        if(tab === 'cases') {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('invContent').style.display = 'none';
        } else {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('invContent').style.display = 'block';
        }
    }

    // ============ МОДАЛКА И ОПЛАТА ============
    function openCase(c) {
        currentCase = c;
        document.getElementById('modalTitle').textContent = c.name;
        const opts = document.getElementById('payOptions');
        
        opts.innerHTML = `
            <button class="pay-btn" onclick="payStars()">
                <span>Оплатить звездами</span>
                <span>${c.price} ⭐</span>
            </button>
            <button class="pay-btn" onclick="payTon()">
                <span>Оплатить TON</span>
                <span>${(c.price / TON_RATE).toFixed(2)} TON</span>
            </button>
        `;
        
        document.getElementById('payStep').style.display = 'block';
        document.getElementById('spinStep').style.display = 'none';
        document.getElementById('resultStep').style.display = 'none';
        document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
        if(isSpinning) return;
        document.getElementById('modal').classList.remove('show');
    }

    function payStars() {
        if(userStars < currentCase.price) return alert("Недостаточно звезд!");
        userStars -= currentCase.price;
        updateUI();
        startRoulette();
    }

    async function payTon() {
        if(!tonConnectUI) return alert("Ошибка TON");
        const amountTon = currentCase.price / TON_RATE;
        const invoiceId = 'INV_' + Date.now();
        
        try {
            const { beginCell } = TON_CORE;
            const cell = beginCell().storeUint(0, 32).storeStringTail(invoiceId).endCell();
            
            await tonConnectUI.sendTransaction({
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: RECEIVER,
                    amount: String(Math.floor(amountTon * 1e9)),
                    payload: cell.toBoc().toString('base64')
                }]
            });
            
            // После отправки запускаем (для теста можноАД сразу, в реальности нужен опрос API)
            startRoulette();
        } catch(e) {
            console.log(e);
        }
    }

    // ============ РУЛЕТКА И ВЫПЕНИЕ ============
    function startRoulette() {
        document.getElementById('payStep').style.display = 'none';
        document.getElementById('spinStep').style.display = 'block';
        isSpinning = true;

        // Выбираем приз
        const validPool = nftPool.filter(i => i.val <= currentCase.max);
        const prize = validPool[Math.floor(Math.random() * validPool.length)];

        // Заполняем ленту (10 элементов для красоты)
        const track = document.getElementById('rItems');
        track.innerHTML = '';
        let itemsHtml = '';
        
        // Генерируем рандомные элементы, а в центр ставим наш приз
        for(let i=0; i<20; i++) {
            let item = validPool[Math.floor(Math.random() * validPool.length)];
            if(i === 15) item = prize; // Выигрышный элемент
            
            itemsHtml += `
                <div class="r-item">
                    <img src="${item.icon}">
                    <span>${item.val} ⭐</span>
                </div>
            `;
        }
        track.innerHTML = itemsHtml;
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';

        // Анимация кручения
        setTimeout(() => {
            track.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)';
            
            // Смещение: 15-й элемент в центр. Ширина элемента 130px (120+10gap)
            // Нам нужно сдвинуть ленту влево так, чтобы 15-й элемент встал по центру (на 50% экрана)
            const trackWidth = document.querySelector('.r-track').offsetWidth;
            const itemCenter = (15 * 130) + 60; // 60 - половина ширины
            const windowCenter = trackWidth / 2;
            const moveTo = -(itemCenter - windowCenter);
            
            track.style.transform = `translateX(${moveTo}px)`;
            
            // Конец анимации
            setTimeout(() => {
                showResult(prize);
            }, 3600);
        }, 100);
    }

    function showResult(prize) {
        isSpinning = false;
        document.getElementById('spinStep').style.display = 'none';
        document.getElementById('resultStep').style.display = 'flex';
        
        document.getElementById('resImg').src = prize.icon;
        document.getElementById('resName').textContent = prize.name;
        document.getElementById('resPrice').textContent = prize.val + " ⭐";

        // Сохраняем в коллекцию
        inventory.push(prize);
        localStorage.setItem('cv_inv_v2', JSON.stringify(inventory));
        renderInv();
    }

    function renderInv() {
        const g = document.getElementById('invList');
        if(inventory.length === 0) {
            g.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#666; padding: 20px;">Инвентарь пуст</div>';
            return;
        }
        g.innerHTML = '';
        inventory.forEach(item => {
            const div = document.createElement('div');
            div.className = 'inv-card';
            div.innerHTML = `
                <img src="${item.icon}">
                <div class="inv-name">${item.name}</div>
                <div class="inv-price">${item.val} ⭐</div>
            `;
            g.appendChild(div);
        });
    }

    // ============ ЗВЕЗДЫ (ФОН) ============
    function drawStars() {
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        
        const stars = Array.from({length: 100}).map(() => ({
            x: Math.random() * w,
            y: Math.random() * h,
            s: Math.random() * 1.5,
            v: Math.random() * 0.5 + 0.1
        }));

        function render() {
            ctx.clearRect(0, 0, w, h);
            stars.forEach(st => {
                st.y += st.v;
                if(st.y > h) st.y = 0;
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5 + 0.3})`;
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.s, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(render);
        }
        render();
    }

    window.onload = init;
</script>
</body>
</html>
