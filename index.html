<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cosmos</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@latest/dist/browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script>
        try {
            var savedTheme = localStorage.getItem('cosmos-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #070707;
            --text: #f5f5f5;
            --muted: #8d8d8d;
            --line: rgba(255,255,255,0.08);
            --card: #141414;
            --card-2: #1a1a1a;
            --cta-bg: #ffffff;
            --cta-fg: #111111;
            --nav: rgba(12,12,12,0.92);
            --gift: #161616;
            --gift-top: #2a2a2a;
            --ribbon: #d8d8d8;
            --spark: #ffffff;
            --switch: #1b1b1b;
            --switch-on: #0e0e0e;
            --shadow: 0 18px 40px rgba(0,0,0,0.35);
            --orbit: rgba(255,255,255,0.22);
        }
        html[data-theme="light"] {
            --bg: #f3f3f4;
            --text: #111111;
            --muted: #8a8a8a;
            --line: rgba(0,0,0,0.06);
            --card: #ffffff;
            --card-2: #f7f7f8;
            --cta-bg: #111111;
            --cta-fg: #ffffff;
            --nav: rgba(255,255,255,0.94);
            --gift: #f6f6f6;
            --gift-top: #ffffff;
            --ribbon: #161616;
            --spark: #111111;
            --switch: #ececef;
            --switch-on: #111111;
            --shadow: 0 18px 40px rgba(0,0,0,0.08);
            --orbit: rgba(0,0,0,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { background: var(--bg); color: var(--text); min-height: 100%; }
        body { overflow-x: hidden; }

        .spark {
            position: fixed; pointer-events: none; z-index: 0; color: var(--spark); opacity: 0.85;
        }
        .spark-a { top: 86px; right: 22px; font-size: 18px; }
        .spark-b { bottom: 210px; right: 18px; font-size: 14px; opacity: 0.5; }
        html[data-theme="light"] .spark-a { top: 92px; left: auto; right: 18px; }
        html[data-theme="light"] .spark-b { left: 22px; right: auto; bottom: 240px; }

        #preloader { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.4s; }
        .orbit-loader { width: 54px; height: 54px; border: 2px solid transparent; border-top-color: var(--text); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #app { opacity: 0; transition: opacity 0.45s; position: relative; z-index: 1; max-width: 430px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

        .topbar { padding: 14px 20px 4px; display: flex; justify-content: space-between; align-items: flex-start; }
        .brand { font-weight: 800; font-size: 32px; letter-spacing: -1.2px; line-height: 1; }
        .brand span { display: block; margin-top: 5px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

        .theme-switch { display: flex; align-items: center; gap: 2px; background: var(--switch); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
        .theme-btn { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
        .theme-btn.active { background: var(--switch-on); color: #fff; }
        html[data-theme="light"] .theme-btn.active { color: #fff; }
        html[data-theme="dark"] .theme-btn.active { background: #111; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }

        .balances { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 20px 4px; }
        .bal-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 12px 12px 12px 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--shadow); min-height: 72px; }
        .bal-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line); flex-shrink: 0; }
        .bal-meta { min-width: 0; flex: 1; }
        .bal-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; }
        .bal-val { font-size: 14px; font-weight: 800; white-space: nowrap; }
        .chev { opacity: 0.4; font-size: 13px; flex-shrink: 0; }

        .hero { padding: 4px 20px 4px; text-align: center; }
        .gift-wrap { position: relative; height: 168px; display: grid; place-items: center; margin: 0 0 2px; }
        .orbit { position: absolute; width: 230px; height: 92px; border: 1.5px solid var(--orbit); border-radius: 50%; transform: rotate(-18deg); top: 78px; }
        .orbit:nth-child(2) { width: 210px; height: 78px; transform: rotate(16deg); top: 92px; opacity: 0.7; }
        .gift { position: relative; width: 118px; height: 118px; filter: drop-shadow(0 18px 18px rgba(0,0,0,0.28)); }
        .gift-box { position: absolute; left: 14px; top: 38px; width: 90px; height: 72px; background: linear-gradient(180deg, var(--gift-top), var(--gift)); border-radius: 8px 8px 10px 10px; box-shadow: inset 0 0 0 1px var(--line); }
        .gift-lid { position: absolute; left: 8px; top: 22px; width: 102px; height: 28px; background: var(--gift-top); border-radius: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.12), inset 0 0 0 1px var(--line); }
        .rib-v { position: absolute; left: 54px; top: 22px; width: 10px; height: 88px; background: var(--ribbon); border-radius: 2px; }
        .rib-h { position: absolute; left: 8px; top: 32px; width: 102px; height: 10px; background: var(--ribbon); }
        .bow { position: absolute; left: 36px; top: 2px; width: 46px; height: 28px; }
        .bow i { position: absolute; top: 6px; width: 24px; height: 18px; background: var(--ribbon); border-radius: 50% 50% 40% 40%; }
        .bow i:first-child { left: 0; transform: rotate(-28deg); }
        .bow i:last-child { right: 0; transform: rotate(28deg); }
        .plane { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; background: #111; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
        html[data-theme="light"] .plane { background: #111; }

        .hero h2 { font-size: 30px; letter-spacing: -0.8px; margin-top: 0; }
        .hero p { color: var(--muted); font-size: 13px; line-height: 1.35; margin: 6px auto 14px; max-width: 240px; }
        .open-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 200px; background: var(--cta-bg); color: var(--cta-fg); border: 0; border-radius: 999px; padding: 13px 22px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }

        .section { padding: 16px 20px 24px; }
        .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .section-head h3 { font-size: 18px; font-weight: 800; }
        .all-link { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; }

        .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .case-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px 14px; text-align: center; cursor: pointer; box-shadow: var(--shadow); }
        .mini-gift { height: 70px; position: relative; margin-bottom: 4px; overflow: hidden; }
        .mini-gift .gift { transform: scale(0.62); transform-origin: center top; left: 50%; margin-left: -59px; }
        .case-card h4 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .case-card .price { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
        .case-open { background: none; border: 0; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }

        .screen { display: none; }
        .screen.active { display: block; }
        .empty { padding: 80px 30px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; }

        .tabbar { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--nav); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); z-index: 40; backdrop-filter: blur(16px); }
        .tab { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer; padding: 6px 0; }
        .tab.active { color: var(--text); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .box { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 26px 20px; width: 90%; max-width: 350px; text-align: center; color: var(--text); }
        .box h3 { margin-bottom: 8px; }
        .box p { color: var(--muted); font-size: 12px; margin-bottom: 15px; }
        .num-input { width: 100%; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 15px; color: var(--text); font-size: 24px; text-align: center; margin-bottom: 15px; font-weight: 800; outline: none; }
        .pay-btn { background: var(--cta-bg); color: var(--cta-fg); border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; margin-bottom: 8px; }
        .cancel-btn { background: none; border: none; color: var(--muted); margin-top: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="preloader"><div class="orbit-loader"></div></div>
    <div class="spark spark-a">✦</div>
    <div class="spark spark-b">✦</div>

    <div id="app">
        <div class="topbar">
            <div class="brand">cosmos<span>подарки в Telegram</span></div>
            <div class="theme-switch" role="group" aria-label="Тема">
                <button class="theme-btn" id="themeDark" type="button" onclick="setTheme('dark')" aria-label="Тёмная">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 14.3A9 9 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg>
                </button>
                <button class="theme-btn" id="themeLight" type="button" onclick="setTheme('light')" aria-label="Светлая">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
        </div>

        <div id="screen-cases" class="screen active">
            <div class="balances">
                <div class="bal-card" role="button" onclick="openTopup()">
                    <div class="bal-ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.8 5.7 20.8 8 13.6 2 9.2h7.6z"/></svg>
                    </div>
                    <div class="bal-meta">
                        <div class="bal-label">Ваш баланс</div>
                        <div class="bal-val"><span id="balStars">0.00</span> TON</div>
                    </div>
                    <span class="chev">→</span>
                </div>
                <div class="bal-card" role="button" onclick="openTopup()">
                    <div class="bal-ico">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 6.5-3 13.5H7L4 8.5 12 2zm0 4.2L7.8 9.6 9.4 17h5.2l1.6-7.4L12 6.2z"/></svg>
                    </div>
                    <div class="bal-meta">
                        <div class="bal-label">Ваш баланс</div>
                        <div class="bal-val"><span id="balTon">0.00</span> TON</div>
                    </div>
                    <span class="chev">→</span>
                </div>
            </div>

            <div class="hero">
                <div class="gift-wrap">
                    <div class="orbit"></div>
                    <div class="orbit"></div>
                    <div class="gift" id="heroGift">
                        <div class="gift-box"></div>
                        <div class="gift-lid"></div>
                        <div class="rib-v"></div>
                        <div class="rib-h"></div>
                        <div class="bow"><i></i><i></i></div>
                        <div class="plane">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M21.5 3.5L2.8 10.7c-.9.3-.8 1.6.1 1.8l4.7 1.1 1.8 5.6c.3.9 1.5 1 1.9.2l2.6-4.7 5.1 3.7c.8.6 1.9 0 2-1L22.7 4.4c.2-1-.9-1.7-1.8-.9z"/></svg>
                        </div>
                    </div>
                </div>
                <h2>Кейсы</h2>
                <p>Открой кейс и получи редкий подарок в Telegram</p>
                <button class="open-btn" type="button" onclick="document.getElementById('casesSection').scrollIntoView({behavior:'smooth'})">Открыть кейс →</button>
            </div>

            <div class="section" id="casesSection">
                <div class="section-head">
                    <h3>Доступные кейсы</h3>
                    <button class="all-link" type="button">Все →</button>
                </div>
                <div class="cases" id="casesGrid">
                    <div class="case-card" onclick="alert('Кейсы в разработке')">
                        <div class="mini-gift"><div class="gift"><div class="gift-box"></div><div class="gift-lid"></div><div class="rib-v"></div><div class="rib-h"></div><div class="bow"><i></i><i></i></div></div></div>
                        <h4>Обычный кейс</h4>
                        <div class="price">От 0.1 TON</div>
                        <button class="case-open" type="button">Открыть →</button>
                    </div>
                    <div class="case-card" onclick="alert('Кейсы в разработке')">
                        <div class="mini-gift"><div class="gift"><div class="gift-box"></div><div class="gift-lid"></div><div class="rib-v"></div><div class="rib-h"></div><div class="bow"><i></i><i></i></div></div></div>
                        <h4>Премиум кейс</h4>
                        <div class="price">От 0.5 TON</div>
                        <button class="case-open" type="button">Открыть →</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-collection" class="screen">
            <div class="empty">Коллекция появится здесь после открытия кейсов</div>
        </div>
        <div id="screen-profile" class="screen">
            <div class="empty">Профиль</div>
        </div>
    </div>

    <nav class="tabbar">
        <button class="tab active" id="tab-cases" type="button" onclick="showScreen('cases')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M3 10h18M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Кейсы
        </button>
        <button class="tab" id="tab-collection" type="button" onclick="showScreen('collection')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 6.3L21 10l-5 4.4 1.5 6.6L12 17.8 6.5 21 8 14.4 3 10l6.3-.7L12 3z"/></svg>
            Коллекция
        </button>
        <button class="tab" id="tab-profile" type="button" onclick="showScreen('profile')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.5-3.2 4-4.8 7-4.8S17.5 15.8 19 19"/></svg>
            Профиль
        </button>
    </nav>

    <div class="modal" id="topupModal">
        <div class="box">
            <h3>ПОПОЛНЕНИЕ</h3>
            <p>Введите сумму (мин. 50)</p>
            <input type="number" class="num-input" id="topupAmount" placeholder="100" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button class="pay-btn" onclick="startTonPayment()">ОПЛАТИТЬ TON</button>
            <button class="cancel-btn" onclick="document.getElementById('topupModal').classList.remove('show')">ОТМЕНА</button>
            <div id="payStatus" style="margin-top:15px; color:gold; font-size:12px; word-break: break-word;"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://oawmltaiiryankxvtzrc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ITLPWUq4nnEEe1VGmEmuJw_dLjOvozA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const RECEIVER = "UQBYFdivQebVdF1Q2moiL42d_zPtjXrMiuj9HmmzCPTuZy8m";
    const TON_RATE = 100;

    let userStars = 0;
    let telegramId = null;
    let tonConnectUI = null;
    const tg = window.Telegram?.WebApp;

    if(tg) { tg.expand(); }

    try {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: location.origin + '/tonconnect-manifest.json',
            uiPreferences: { theme: 'DARK' }
        });
    } catch(e) { console.error("TON Init Error:", e); }

    function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    }

    function syncThemeButtons() {
        const theme = currentTheme();
        document.getElementById('themeDark').classList.toggle('active', theme === 'dark');
        document.getElementById('themeLight').classList.toggle('active', theme === 'light');
        if (tg && tg.setHeaderColor) {
            tg.setHeaderColor(theme === 'light' ? '#f3f3f4' : '#070707');
            tg.setBackgroundColor(theme === 'light' ? '#f3f3f4' : '#070707');
        }
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('cosmos-theme', theme); } catch (e) {}
        syncThemeButtons();
    }

    function showScreen(name) {
        ['cases', 'collection', 'profile'].forEach((id) => {
            document.getElementById('screen-' + id).classList.toggle('active', id === name);
            document.getElementById('tab-' + id).classList.toggle('active', id === name);
        });
    }

    function renderBalance() {
        const starEl = document.getElementById('balStars');
        if (starEl) starEl.textContent = (userStars / TON_RATE).toFixed(2);
    }

    setTimeout(() => {
        document.getElementById('preloader').style.opacity = '0';
        document.getElementById('app').style.opacity = '1';
        setTimeout(() => document.getElementById('preloader').style.display = 'none', 400);
    }, 1000);

    syncThemeButtons();

    async function loadUser() {
        if (!tg || !tg.initDataUnsafe?.user) return;
        telegramId = tg.initDataUnsafe.user.id;
        const { data } = await supabase.from('players').select('*').eq('telegram_id', telegramId).single();
        if (data) {
            userStars = data.stars;
            renderBalance();
        }
    }
    loadUser();

    function openTopup() {
        document.getElementById('topupModal').classList.add('show');
        document.getElementById('payStatus').textContent = '';
    }

    async function startTonPayment() {
        const amountInput = document.getElementById('topupAmount');
        const starsToAdd = parseInt(amountInput.value);
        const statusEl = document.getElementById('payStatus');

        statusEl.style.color = 'gold';
        statusEl.textContent = "Обработка...";

        if (!starsToAdd || starsToAdd < 50) {
            statusEl.textContent = "Ошибка: Минимальная сумма 50 звезд.";
            return;
        }

        if (!tonConnectUI) {
            statusEl.textContent = "Ошибка: Кошелек не инициализирован.";
            return;
        }

        if (!tonConnectUI.wallet) {
            statusEl.textContent = "Подключение кошелька...";
            tonConnectUI.openModal();
            return;
        }

        const tonAmount = starsToAdd / TON_RATE;
        const invoiceId = 'PAY_' + Date.now();

        try {
            statusEl.textContent = "Формирование транзакции...";

            let payload = null;
            if (window.TON_CORE && window.TON_CORE.beginCell) {
                const cell = window.TON_CORE.beginCell().storeUint(0, 32).storeStringTail(invoiceId).endCell();
                payload = cell.toBoc().toString('base64');
            }

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: RECEIVER,
                    amount: String(Math.floor(tonAmount * 1e9)),
                }]
            };

            if (payload) tx.messages[0].payload = payload;

            statusEl.textContent = "Ожидание подтверждения в приложении...";
            await tonConnectUI.sendTransaction(tx);
            statusEl.textContent = "Транзакция отправлена! Ждем сеть...";

            let attempts = 0;
            const checkInterval = setInterval(async () => {
                attempts++;
                try {
                    const check = await fetch('/api/check-payments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'check_payment',
                            invoiceId: invoiceId,
                            expectedTon: tonAmount
                        })
                    });
                    const res = await check.json();

                    if (res.paid) {
                        clearInterval(checkInterval);
                        statusEl.style.color = '#00ff00';
                        statusEl.textContent = "Оплата прошла! Начисляем...";

                        userStars += starsToAdd;
                        renderBalance();
                        if (telegramId) {
                            await supabase.from('players').update({ stars: userStars }).eq('telegram_id', telegramId);
                        }

                        statusEl.textContent = `Успешно начислено ${starsToAdd} звезд!`;
                        setTimeout(() => document.getElementById('topupModal').classList.remove('show'), 2000);
                    } else if (attempts > 12) {
                        clearInterval(checkInterval);
                        statusEl.style.color = 'red';
                        statusEl.textContent = "Сеть не подтвердила платеж. Попробуйте позже.";
                    }
                } catch (err) {
                    if (attempts > 12) {
                        clearInterval(checkInterval);
                        statusEl.style.color = 'red';
                        statusEl.textContent = "Сеть не подтвердила платеж. Попробуйте позже.";
                    }
                }
            }, 5000);

        } catch (e) {
            console.error("TX Error:", e);
            statusEl.style.color = 'red';
            statusEl.textContent = "Отклонено: " + (e.message || "Пользователь отменил транзакцию или недостаточно TON");
        }
    }
</script>
</body>
</html>
