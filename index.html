<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC VAULT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@ton/core@latest/dist/browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <style>
        :root { --bg: #050505; --card: rgba(20,20,20,0.8); --border: rgba(255,255,255,0.1); --text: #fff; --muted: #888; --accent: #9d00ff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        
        #preloader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s; }
        .orbit-loader { width: 80px; height: 80px; border: 2px solid transparent; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #app { opacity: 0; transition: opacity 0.5s; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50;}
        .balances { display: flex; gap: 10px; align-items: center; }
        .bal { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 14px; background: var(--card); padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); }
        .topup-btn { background: var(--accent); color: #fff; border: none; padding: 8px 15px; border-radius: 20px; font-weight: 800; cursor: pointer; }

        .content { padding: 20px; max-width: 500px; margin: 0 auto; }
        .grid { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 15px; display: flex; align-items: center; cursor: pointer; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .box { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 350px; text-align: center; }
        
        .num-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 15px; color: #fff; font-size: 24px; text-align: center; margin-bottom: 15px; font-weight: 800; outline: none; }
        .pay-btn { background: var(--accent); border: none; border-radius: 12px; padding: 18px; font-size: 16px; font-weight: 800; color: #fff; width: 100%; cursor: pointer; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div id="preloader"><div class="orbit-loader"></div></div>
    
    <div id="app">
        <canvas id="stars-canvas"></canvas>
        <div class="header">
            <div style="font-weight:900; font-size:18px;">COSMIC</div>
            <div class="balances">
                <div class="bal">⭐ <span id="balStars">0</span></div>
                <button class="topup-btn" onclick="openTopup()">ПОПОЛНИТЬ</button>
            </div>
        </div>

        <div class="content">
            <div class="grid" id="casesGrid">
                <!-- Тестовый кейс -->
                <div class="card" onclick="alert('Кейсы в разработке')">
                    <div style="font-size:24px; margin-right:15px;">💎</div>
                    <div><div style="font-weight:800;">ТЕСТОВЫЙ КЕЙС</div><div style="font-size:12px; color:#888;">Стоимость: 50 ⭐</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Окно пополнения -->
    <div class="modal" id="topupModal">
        <div class="box">
            <h3 style="margin-bottom:10px;">ПОПОЛНЕНИЕ</h3>
            <p style="color:#888; font-size:12px; margin-bottom:15px;">Введите сумму (мин. 50)</p>
            <input type="number" class="num-input" id="topupAmount" placeholder="100" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button class="pay-btn" onclick="startTonPayment()">ОПЛАТИТЬ TON</button>
            <button style="background:none; border:none; color:#888; margin-top:10px;" onclick="document.getElementById('topupModal').classList.remove('show')">ОТМЕНА</button>
            <div id="payStatus" style="margin-top:15px; color:gold; font-size:12px; word-break: break-word;"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://oawmltaiiryankxvtzrc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ITLPWUq4nnEEe1VGmEmuJw_dLjOvozA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const RECEIVER = "UQBYFdivQebVdF1Q2moiL42d_zPtjXrMiuj9HmmzCPTuZy8m";
    const TON_RATE = 100;

    let userStars = 0;
    let telegramId = null;
    let tonConnectUI = null;
    const tg = window.Telegram?.WebApp;

    if(tg) { tg.expand(); }

    try {
        tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: location.origin + '/tonconnect-manifest.json',
            uiPreferences: { theme: 'DARK' }
        });
    } catch(e) { console.error("TON Init Error:", e); }

    setTimeout(() => {
        document.getElementById('preloader').style.opacity = '0';
        document.getElementById('app').style.opacity = '1';
        setTimeout(() => document.getElementById('preloader').style.display = 'none', 400);
    }, 1000);

    async function loadUser() {
        if (!tg || !tg.initDataUnsafe?.user) return;
        telegramId = tg.initDataUnsafe.user.id;
        const { data } = await supabase.from('players').select('*').eq('telegram_id', telegramId).single();
        if (data) {
            userStars = data.stars;
            document.getElementById('balStars').textContent = userStars;
        }
    }
    loadUser();

    function openTopup() {
        document.getElementById('topupModal').classList.add('show');
        document.getElementById('payStatus').textContent = '';
    }

    async function startTonPayment() {
        const amountInput = document.getElementById('topupAmount');
        const starsToAdd = parseInt(amountInput.value);
        const statusEl = document.getElementById('payStatus');

        statusEl.style.color = 'gold';
        statusEl.textContent = "Обработка...";

        if (!starsToAdd || starsToAdd < 50) {
            statusEl.textContent = "Ошибка: Минимальная сумма 50 звезд.";
            return;
        }

        if (!tonConnectUI) {
            statusEl.textContent = "Ошибка: Кошелек не инициализирован.";
            return;
        }

        if (!tonConnectUI.wallet) {
            statusEl.textContent = "Подключение кошелька...";
            tonConnectUI.openModal();
            return;
        }

        const tonAmount = starsToAdd / TON_RATE;
        const invoiceId = 'PAY_' + Date.now();

        try {
            statusEl.textContent = "Формирование транзакции...";
            
            let payload = null;
            // Безопасная проверка наличия библиотеки для комментария
            if (window.TON_CORE && window.TON_CORE.beginCell) {
                const cell = window.TON_CORE.beginCell().storeUint(0, 32).storeStringTail(invoiceId).endCell();
                payload = cell.toBoc().toString('base64');
            }

            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: RECEIVER,
                    amount: String(Math.floor(tonAmount * 1e9)),
                }]
            };
            
            if (payload) tx.messages[0].payload = payload;

            statusEl.textContent = "Ожидание подтверждения в приложении...";

            // Отправляем
            await tonConnectUI.sendTransaction(tx);

            // Если код дошел сюда - значит транзакция отправлена
            statusEl.textContent = "Транзакция отправлена! Ждем сеть (15 сек)...";
            
            let attempts = 0;
            const checkInterval = setInterval(async () => {
                attempts++;
                
                // Заглушка для проверки (если API не настроен)
                const check = await fetch('/api/check-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ invoiceId: invoiceId, expectedTon: tonAmount })
                }).catch(() => ({ json: () => ({ paid: false }) })); // Игнорируем ошибки сети
                
                const res = await check.json();

                if (res.paid) {
                    clearInterval(checkInterval);
                    statusEl.style.color = '#00ff00';
                    statusEl.textContent = "✅ Оплата прошла! Начисляем...";
                    
                    userStars += starsToAdd;
                    document.getElementById('balStars').textContent = userStars;
                    await supabase.from('players').update({ stars: userStars }).eq('telegram_id', telegramId);
                    
                    statusEl.textContent = `Успешно начислено ${starsToAdd} звезд!`;
                    setTimeout(() => document.getElementById('topupModal').classList.remove('show'), 2000);
                } else if (attempts > 12) {
                    clearInterval(checkInterval);
                    statusEl.style.color = 'red';
                    statusEl.textContent = "Сеть не подтвердила платеж. Попробуйте позже.";
                }
            }, 5000);

        } catch (e) {
            console.error("TX Error:", e);
            statusEl.style.color = 'red';
            // Выводим реальную ошибку на экран
            statusEl.textContent = "Отклонено: " + (e.message || "Пользователь отменил транзакцию или недостаточно TON");
        }
    }
</script>
</body>
</html>
