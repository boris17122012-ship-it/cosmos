<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЧЕРНАЯ ДЫРА | CASES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --card: rgba(15, 15, 15, 0.8); 
            --border: rgba(255,255,255,0.1); 
            --text: #ffffff; 
            --muted: #666; 
            --accent: #ffffff;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* Звездный фон */
        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        #preloader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s; }
        .orbit-loader { width: 80px; height: 80px; position: relative; margin-bottom: 30px; }
        .orbit-loader::before, .orbit-loader::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
        .orbit-loader::before { inset: 0; border-top-color: #fff; animation: spin 1.5s linear infinite; }
        .orbit-loader::after { inset: 15px; border-bottom-color: #fff; animation: spin 2s linear infinite reverse; }
        .load-text { font-size: 12px; letter-spacing: 3px; color: #888; text-transform: uppercase; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #app { opacity: 0; transition: opacity 0.5s; }
        
        /* Хедер */
        .header { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 50; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255,255,255,0.5); text-align: center; line-height: 1.2; }
        .balances { display: flex; gap: 10px; align-items: center; }
        .bal { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; }
        
        .topup-btn { background: #fff; color: #000; font-weight: 900; padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .topup-btn:active { transform: scale(0.95); }

        .content { padding: 10px 20px; max-width: 500px; margin: 0 auto; }
        .grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 100px; }
        
        /* Карточка кейса (Кристалл) */
        .card { 
            position: relative; 
            background: rgba(10,10,10,0.8); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            overflow: hidden;
            transition: 0.2s; 
        }
        .card:active { transform: scale(0.97); background: rgba(20,20,20,0.9); }
        
        /* Разноцветные кристаллы (имитация картинок) */
        .c-img { width: 70px; height: 70px; margin-right: 20px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .c-img.c1 { background: radial-gradient(circle, #fff, #555); box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .c-img.c2 { background: radial-gradient(circle, #00d4ff, #0055ff); box-shadow: 0 0 20px rgba(0,212,255,0.4); color: #fff;}
        .c-img.c3 { background: radial-gradient(circle, #ff00d4, #8800ff); box-shadow: 0 0 20px rgba(255,0,212,0.4); color: #fff;}
        .c-img.c4 { background: radial-gradient(circle, #ffd700, #ff5500); box-shadow: 0 0 20px rgba(255,215,0,0.4); color: #000;}
        .c-img.c5 { background: radial-gradient(circle, #ff0033, #000); box-shadow: 0 0 30px rgba(255,0,51,0.6); color: #fff;}

        .c-info { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .c-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; }
        .c-desc { font-size: 11px; color: var(--muted); text-transform: uppercase; }
        .c-prices { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        .c-p-stars { font-size: 18px; font-weight: 900; color: #fff; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; display: flex; gap: 10px; background: #000; z-index: 50; max-width: 500px; left: 50%; transform: translateX(-50%); border-top: 1px solid var(--border); }
        .nav-btn { flex: 1; background: transparent; border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; font-size: 14px; font-weight: 900; color: #fff; cursor: pointer; transition: 0.2s; }
        .nav-btn:active { background: rgba(255,255,255,0.1); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        
        .pay-box { background: #050505; border: 1px solid var(--border); border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 350px; text-align: center; }
        .pay-title { font-size: 20px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .pay-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 25px; }
        .pay-options { display: flex; flex-direction: column; gap: 10px; }
        .pay-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 18px; font-size: 15px; font-weight: 800; color: #fff; display: flex; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .pay-btn:active { background: rgba(255,255,255,0.1); }

        .roulette-box { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .r-track { width: 100%; height: 120px; background: rgba(10,10,10,0.9); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; position: relative; display: flex; align-items: center; }
        .r-items { display: flex; gap: 10px; position: absolute; left: 0; padding: 0 15px; transition: transform 0.1s linear; }
        .r-item { width: 90px; height: 90px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
        .r-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .r-item span { font-size: 10px; font-weight: 800; color: var(--muted); }
        .r-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px #fff; }

        .result-box { text-align: center; display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 350px; }
        .result-img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 0 30px #fff); }
        .result-name { font-size: 24px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .result-btn { background: #fff; color: #000; border: none; border-radius: 12px; padding: 16px; width: 100%; font-size: 15px; font-weight: 900; margin-top: 30px; cursor: pointer; text-transform: uppercase; }
        
        /* Коллекция */
        #invList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 100px; }
        .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .inv-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
        .inv-name { font-size: 12px; font-weight: 900; margin-bottom: 4px; }
        .inv-price { font-size: 11px; color: var(--muted); }

        /* Модалка пополнения */
        .topup-box { background: #050505; border: 1px solid #fff; border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 350px; text-align: center; }
        .topup-input { width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 15px; color: #fff; font-size: 20px; text-align: center; margin-bottom: 15px; font-weight: 900; outline: none; }
        .topup-input:focus { border-color: #fff; }
        .topup-confirm { background: #fff; color: #000; font-weight: 900; padding: 15px; border-radius: 8px; border: none; width: 100%; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="preloader">
        <div class="orbit-loader"></div>
        <div class="load-text">ЗАГРУЗКА ВСЕЛЕННОЙ...</div>
    </div>
    <div id="app">
        <canvas id="stars-canvas"></canvas>
        
        <div class="header">
            <div class="logo">ЧЕРНАЯ ДЫРА</div>
            <div class="balances">
                <div class="bal">💎 <span id="balStars">0</span></div>
                <button class="topup-btn" onclick="openTopup()">ПОПОЛНИТЬ</button>
            </div>
        </div>

        <div class="content" id="mainContent">
            <div class="grid" id="casesGrid"></div>
        </div>

        <div class="content" id="invContent" style="display:none;">
            <div class="grid" id="invList"></div>
        </div>

        <div class="nav">
            <button class="nav-btn" onclick="switchTab('cases')">КЕЙСЫ</button>
            <button class="nav-btn" onclick="switchTab('inv')">ИНВЕНТАРЬ</button>
        </div>
    </div>

    <!-- Окно оплаты -->
    <div class="modal" id="modal">
        <div class="pay-box" id="payStep">
            <div class="pay-title" id="modalTitle">ПОДТВЕРЖДЕНИЕ</div>
            <div class="pay-subtitle" id="modalSubtitle">Списать средства?</div>
            <div class="pay-options" id="payOptions"></div>
            <button style="margin-top:20px; background:none; border:none; color:var(--muted); font-size:12px; font-weight: 800; text-transform: uppercase;" onclick="closeModal()">ОТМЕНА</button>
        </div>
        <div class="roulette-box" id="spinStep" style="display:none;">
            <div class="r-track"><div class="r-marker"></div><div class="r-items" id="rItems"></div></div>
        </div>
        <div class="result-box" id="resultStep" style="display:none;">
            <img src="" class="result-img" id="resImg">
            <div class="result-name" id="resName">Название</div>
            <div style="color:var(--muted); font-size:12px; font-weight: 800;" id="resPrice">0</div>
            <button class="result-btn" onclick="closeModal()">ЗАБРАТЬ</button>
        </div>
    </div>

    <!-- Окно пополнения -->
    <div class="modal" id="topupModal">
        <div class="topup-box">
            <div class="pay-title">ПОПОЛНЕНИЕ</div>
            <div class="pay-subtitle" style="margin-bottom:15px;">Введите сумму в звездах</div>
            <input type="number" class="topup-input" id="topupAmount" placeholder="1000">
            <button class="topup-confirm" onclick="confirmTopup()">ОПЛАТИТЬ TON</button>
            <button style="margin-top:15px; background:none; border:none; color:var(--muted); font-size:12px; font-weight: 800; text-transform: uppercase;" onclick="document.getElementById('topupModal').classList.remove('show')">ОТМЕНА</button>
        </div>
    </div>

<script>
    // Ключи Supabase
    const SUPABASE_URL = 'https://oawmltaiiryankxvtzrc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ITLPWUq4nnEEe1VGmEmuJw_dLjOvozA';
    let supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Твои подарки (картинки оставил твои, но названия другие)
    const imgPath = "img/"; 
    const imgs = {
        p1: imgPath + "IMG_6767.jpeg", p2: imgPath + "IMG_6766.jpeg", p3: imgPath + "IMG_6765.jpeg",
        p4: imgPath + "IMG_6763.jpeg", p5: imgPath + "IMG_6764.jpeg", p6: imgPath + "IMG_6761.jpeg",
        p7: imgPath + "IMG_6760.jpeg", p8: imgPath + "IMG_6758.jpeg", p9: imgPath + "IMG_6757.jpeg",
        p10: imgPath + "IMG_6756.jpeg", p11: imgPath + "IMG_6755.jpeg"
    };

    const cases = [
        { id: 1, name: "ЛУННЫЙ СВЕТ", desc: "Белый кристалл", price: 15, max: 25, cssClass: "c1", img: imgs.p1 },
        { id: 2, name: "АСТЕРОИД", desc: "Синий кристалл", price: 50, max: 80, cssClass: "c2", img: imgs.p2 },
        { id: 3, name: "ТУМАННОСТЬ", desc: "Розовый кристалл", price: 150, max: 250, cssClass: "c3", img: imgs.p3 },
        { id: 4, name: "СВЕРХНОВАЯ", desc: "Золотой кристалл", price: 300, max: 400, cssClass: "c4", img: imgs.p4 },
        { id: 5, name: "ЧЕРНАЯ ДЫРА", desc: "Кровавый кристалл", price: 500, max: 1000, cssClass: "c5", img: imgs.p5 }
    ];

    const nftPool = [
        { name: "HEART", val: 10, icon: imgs.p6 }, { name: "BEAR", val: 15, icon: imgs.p7 },
        { name: "CAKE", val: 20, icon: imgs.p8 }, { name: "STAR", val: 25, icon: imgs.p9 },
        { name: "GIFT", val: 40, icon: imgs.p10 }, { name: "RING", val: 60, icon: imgs.p11 },
        { name: "PLANET", val: 80, icon: imgs.p1 }, { name: "PEPE", val: 120, icon: imgs.p2 },
        { name: "DUROV", val: 180, icon: imgs.p3 }, { name: "HORIZON", val: 250, icon: imgs.p4 }
    ];

    let userStars = 0;
    let inventory = [];
    let telegramId = null;
    let currentCase = null;
    let isSpinning = false;
    let topupStars = 0;

    const tg = window.Telegram?.WebApp;
    if(tg) { tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }

    setTimeout(() => { document.getElementById('preloader').style.opacity = '0'; document.getElementById('app').style.opacity = '1'; setTimeout(() => document.getElementById('preloader').style.display = 'none', 300); }, 2000);

    function drawStars() {
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        const stars = Array.from({length: 120}).map(() => ({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 2, v: Math.random() * 0.5 + 0.1 }));
        function render() {
            ctx.clearRect(0, 0, w, h);
            stars.forEach(st => {
                st.y += st.v;
                if(st.y > h) { st.y = 0; st.x = Math.random() * w; }
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5 + 0.3})`;
                ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(render);
        }
        render();
    }

    async function loadData() {
        if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) return;
        telegramId = tg.initDataUnsafe.user.id;
        try {
            const { data, error } = await supabase.from('players').select('*').eq('telegram_id', telegramId).single();
            if (error && error.code === 'PGRST116') {
                const { data: newData } = await supabase.from('players').insert([{ telegram_id: telegramId, stars: 0, inventory: [] }]).select().single();
                if (newData) { userStars = newData.stars; inventory = newData.inventory || []; }
            } else if (data) { userStars = data.stars; inventory = data.inventory || []; }
        } catch(e) {}
    }

    async function saveData() {
        if (!telegramId) return;
        try { await supabase.from('players').update({ stars: userStars, inventory: inventory }).eq('telegram_id', telegramId); } catch(e) {}
    }

    function init() {
        renderCases();
        drawStars();
        loadData().then(() => { updateUI(); renderInv(); });
    }

    function renderCases() {
        const g = document.getElementById('casesGrid');
        g.innerHTML = '';
        cases.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => openCase(c);
            div.innerHTML = `
                <div class="c-img ${c.cssClass}">💎</div>
                <div class="c-info"><div class="c-name">${c.name}</div><div class="c-desc">${c.desc}</div></div>
                <div class="c-prices"><div class="c-p-stars">${c.price} 💎</div></div>
            `;
            g.appendChild(div);
        });
    }

    function updateUI() { document.getElementById('balStars').textContent = userStars; }
    function switchTab(tab) {
        document.getElementById('mainContent').style.display = tab === 'cases' ? 'block' : 'none';
        document.getElementById('invContent').style.display = tab === 'inv' ? 'block' : 'none';
    }

    // Пополнение баланса (пока имитация, в будущем прикрутим TON)
    function openTopup() {
        document.getElementById('topupModal').classList.add('show');
    }
    async function confirmTopup() {
        const amount = parseInt(document.getElementById('topupAmount').value);
        if (amount > 0) {
            userStars += amount;
            updateUI();
            await saveData();
            document.getElementById('topupModal').classList.remove('show');
            document.getElementById('topupAmount').value = '';
        }
    }

    function openCase(c) {
        currentCase = c;
        document.getElementById('modalTitle').textContent = c.name;
        document.getElementById('modalSubtitle').textContent = `Списать ${c.price} кристаллов?`;
        document.getElementById('payOptions').innerHTML = `<button class="pay-btn" onclick="payStars()"><span>ПОДТВЕРДИТЬ</span><span>-${c.price} 💎</span></button>`;
        document.getElementById('payStep').style.display = 'block';
        document.getElementById('spinStep').style.display = 'none';
        document.getElementById('resultStep').style.display = 'none';
        document.getElementById('modal').classList.add('show');
    }

    function closeModal() { if(!isSpinning) document.getElementById('modal').classList.remove('show'); }

    async function payStars() {
        if(userStars < currentCase.price) return alert("Недостаточно кристаллов!");
        userStars -= currentCase.price;
        updateUI(); await saveData();
        startRoulette();
    }

    function startRoulette() {
        document.getElementById('payStep').style.display = 'none';
        document.getElementById('spinStep').style.display = 'block';
        isSpinning = true;
        const validPool = nftPool.filter(i => i.val <= currentCase.max);
        const prize = validPool[Math.floor(Math.random() * validPool.length)];
        const track = document.getElementById('rItems');
        let itemsHtml = '';
        for(let i=0; i<20; i++) {
            let item = validPool[Math.floor(Math.random() * validPool.length)];
            if(i === 15) item = prize;
            itemsHtml += `<div class="r-item"><img src="${item.icon}"><span>${item.val}💎</span></div>`;
        }
        track.innerHTML = itemsHtml;
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        setTimeout(() => {
            track.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)';
            const trackWidth = document.querySelector('.r-track').offsetWidth;
            const moveTo = -(((15 * 110) + 50) - (trackWidth / 2));
            track.style.transform = `translateX(${moveTo}px)`;
            setTimeout(() => { showResult(prize); }, 3600);
        }, 100);
    }

    async function showResult(prize) {
        isSpinning = false;
        document.getElementById('spinStep').style.display = 'none';
        document.getElementById('resultStep').style.display = 'flex';
        document.getElementById('resImg').src = prize.icon;
        document.getElementById('resName').textContent = prize.name;
        document.getElementById('resPrice').textContent = prize.val + " кристаллов";
        inventory.push(prize);
        await saveData();
        renderInv();
    }

    function renderInv() {
        const g = document.getElementById('invList');
        if(inventory.length === 0) {
            g.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#666; padding: 20px; font-size:12px; font-weight:800;">ИНВЕНТАРЬ ПУСТ</div>';
            return;
        }
        g.innerHTML = '';
        inventory.forEach(item => {
            const div = document.createElement('div');
            div.className = 'inv-card';
            div.innerHTML = `<img src="${item.icon}"><div class="inv-name">${item.name}</div><div class="inv-price">${item.val} 💎</div>`;
            g.appendChild(div);
        });
    }

    window.onload = init;
</script>
</body>
</html>
